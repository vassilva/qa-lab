openapi: 3.0.3
info:
  title: QA Lab · Settlement API
  version: 0.5.0
  description: 'T+2 settlement service: consumes trades.executed (Kafka), settles at T2S through files.'
servers:
- url: http://localhost:8001
  description: QA
paths:
  /health:
    get:
      summary: Status of the service, database, bus and consumer
      responses:
        '200':
          description: OK
        '503':
          description: Degraded
  /api/business-date:
    get:
      summary: Business date
      responses:
        '200':
          description: OK
    post:
      summary: Change the business date (TARGET2 business days only)
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
  /api/settlement/instructions:
    get:
      summary: Instructions (filters ?status= and ?trade_id=)
      responses:
        '200':
          description: OK
  /api/settlement/instructions/{instruction_id}/{action}:
    post:
      summary: Hold or release
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '409':
          description: Current status does not allow the operation
      parameters:
      - name: instruction_id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
  /api/eod:
    post:
      summary: 'End of day: file to T2S, confirmations, report'
      responses:
        '200':
          description: OK
  /api/rejected-events:
    get:
      summary: Messages rejected by the contract (DLQ)
      responses:
        '200':
          description: OK
  /api/consumer/{action}:
    post:
      summary: Pause or resume the consumer (simulate unavailability)
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '403':
          description: Not available in UAT
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
  /api/reset:
    post:
      summary: Clear data and adopt the new environment generation
      responses:
        '200':
          description: OK
  /api/query:
    post:
      summary: Read-only SQL query
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
