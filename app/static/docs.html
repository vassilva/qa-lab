<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Lab · Documentação de QA</title>
<style>
  :root{--bg:#0f1729;--panel:#16213a;--line:#25324f;--text:#e8ecf4;--muted:#93a0b8;--accent:#5b9cf5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  header strong{font-size:18px}
  a{color:var(--accent)}
  nav a{margin-right:14px}
  main{max-width:1100px;padding:8px 24px 48px}
  h1{font-size:26px} h2{font-size:20px;margin-top:32px;border-bottom:1px solid var(--line);padding-bottom:4px} h3{font-size:17px}
  table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
  th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  th{background:var(--panel);color:var(--muted);font-weight:600}
  code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:90%}
  pre{background:var(--panel);padding:12px;border-radius:8px;overflow:auto;white-space:pre-wrap}
  pre code{background:none;padding:0}
  li input[type=checkbox]{margin-right:6px}
  td:first-child{white-space:nowrap}
</style>
</head>
<body>
<header>
  <strong>QA Lab · Documentação de QA</strong>
  <nav>
    <a href="/docs/qa/estrategia-de-testes.md">Estratégia de testes</a>
    <a href="/docs/qa/matriz-de-risco.md">Matriz de risco</a>
    <a href="/docs/qa/checklist-release.md">Checklist de release</a>
    <a href="/checklist">Checklist da vaga</a>
    <a href="/">Mini bolsa</a>
  </nav>
</header>
<main id="content">A carregar…</main>
<script src="/static/markdown.js"></script>
<script>
const path = location.pathname.replace(/^\/docs\//, "");
fetch("/docs-raw/" + path).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(md => {
  const main = document.getElementById("content");
  main.innerHTML = window.renderMarkdown(md);
  const h1 = main.querySelector("h1"); if (h1) document.title = h1.textContent;
}).catch(() => { document.getElementById("content").textContent = "Documento não encontrado."; });
</script>
</body>
</html>
