# QA Lab shared tools: Jenkins (CI/CD) and Adminer (database in the browser).
# In Docker Desktop they appear in the "qa-lab-tools" group.
# Before the first time:   docker network create qa-lab-net
# Start:                   docker compose up -d --build
#
#   Jenkins  http://localhost:8090   (user admin / admin)
#   Adminer  http://localhost:8081   (PostgreSQL · server qa-lab-qa-db or qa-lab-uat-db · qa / qa · qa_lab or settlement)
#
# The QA and UAT environments are created by the Jenkins pipeline (see docker-compose.env.yml).

name: qa-lab-tools

services:
  jenkins:
    build: ./jenkins
    image: qa-lab-jenkins:local
    container_name: qa-lab-jenkins
    user: root                      # needed to use your computer's Docker (lab only)
    ports:
      - "8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Jenkins drives Docker to run the deployments
      - ./:/repo/qa-lab:ro                          # your local Git repository (read-only)
    restart: unless-stopped
    networks:
      - qa-lab-net

  adminer:
    image: adminer:4
    container_name: qa-lab-adminer
    environment:
      ADMINER_DEFAULT_SERVER: qa-lab-qa-db
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - qa-lab-net

volumes:
  jenkins_home:
    name: qa-lab_jenkins_home     # keeps the existing build history

networks:
  qa-lab-net:
    external: true
