openapi: 3.0.3
info:
  title: QA Lab · Trading API
  version: 0.5.0
  description: Order Entry Gateway, Matching Engine, Market Data and forwarding to Settlement. Inspired by Euronext's
    public architecture.
servers:
- url: http://localhost:8000
  description: QA
paths:
  /health:
    get:
      summary: Service and dependency status (database, bus, Settlement, outbox)
      responses:
        '200':
          description: OK
        '503':
          description: Database unavailable
  /api/symbols:
    get:
      summary: Symbols and reference prices
      responses:
        '200':
          description: OK
  /api/orders:
    post:
      summary: New order (Order Entry Gateway). No price = market order
      responses:
        '201':
          description: Accepted
        '400':
          description: Invalid request
        '422':
          description: Rejected by the gateway rules
    get:
      summary: List orders (filter ?status=)
      responses:
        '200':
          description: OK
  /api/orders/{order_id}:
    get:
      summary: Get an order
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Cancel an order
      responses:
        '200':
          description: OK
        '409':
          description: Current status does not allow the operation
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
  /api/book/{symbol}:
    get:
      summary: Order book (Market Data)
      responses:
        '200':
          description: OK
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
  /api/trades:
    get:
      summary: Trades (filter ?symbol=)
      responses:
        '200':
          description: OK
  /api/business-date:
    get:
      summary: Business date (from Settlement)
      responses:
        '200':
          description: OK
        '503':
          description: Dependent service unavailable
    post:
      summary: Change the business date (business days only)
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '503':
          description: Dependent service unavailable
  /api/settlement/instructions:
    get:
      summary: Settlement instructions (from Settlement)
      responses:
        '200':
          description: OK
        '503':
          description: Dependent service unavailable
  /api/settlement/instructions/{instruction_id}/{action}:
    post:
      summary: Hold or release an instruction
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '409':
          description: Current status does not allow the operation
        '503':
          description: Dependent service unavailable
      parameters:
      - name: instruction_id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
  /api/eod:
    post:
      summary: End of day (in Settlement)
      responses:
        '200':
          description: OK
        '503':
          description: Dependent service unavailable
  /api/integration:
    get:
      summary: 'Integration status: bus, outbox, Settlement, T2S'
      responses:
        '200':
          description: OK
  /api/reconciliation:
    get:
      summary: 'Cross-system reconciliation: trades vs. instructions'
      responses:
        '200':
          description: OK
        '503':
          description: Dependent service unavailable
  /api/integration/replay/{trade_id}:
    post:
      summary: Publish a trade's event again (idempotency test)
      responses:
        '200':
          description: OK
        '403':
          description: Not available in UAT
        '404':
          description: Not found
      parameters:
      - name: trade_id
        in: path
        required: true
        schema:
          type: string
  /api/integration/publish-raw:
    post:
      summary: Publish an arbitrary message (contract and DLQ test)
      responses:
        '200':
          description: OK
        '403':
          description: Not available in UAT
  /api/t2s/mode:
    post:
      summary: Change the T2S simulator mode
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '403':
          description: Not available in UAT
        '503':
          description: Dependent service unavailable
  /api/reset:
    post:
      summary: Reset the environment (Trading, Settlement, T2S)
      responses:
        '200':
          description: OK
  /api/query:
    post:
      summary: 'Read-only SQL query (db: trading or settlement)'
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
  /api/checklist:
    get:
      summary: Job checklist
      responses:
        '200':
          description: OK
  /api/docs:
    get:
      summary: Documentation index
      responses:
        '200':
          description: OK
