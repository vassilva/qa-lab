openapi: 3.0.3
info:
  title: QA Lab · T2S simulator
  version: 0.5.0
  description: 'TARGET2-Securities simulator: processes instruction files and returns confirmations.'
servers:
- url: http://localhost:8002
  description: QA
paths:
  /health:
    get:
      summary: Status and current mode
      responses:
        '200':
          description: OK
  /api/mode:
    get:
      summary: Current mode
      responses:
        '200':
          description: OK
    post:
      summary: Change the mode (normal, reject_symbol, reject_all, slow, unavailable)
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
  /api/process:
    post:
      summary: Process an SI_*.csv file and write CONF_*.csv
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request
        '503':
          description: Simulator in unavailable mode
  /api/reset:
    post:
      summary: Back to normal mode
      responses:
        '200':
          description: OK
