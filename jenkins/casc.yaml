# Jenkins configuration as code (Configuration as Code plugin)
jenkins:
  systemMessage: "QA Lab · lab Jenkins · GitHub PR → merge → Build → QA → approval → UAT (rollback on failed smoke)"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "QA Lab Admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

appearance:
  themeManager:
    disableUserThemes: true     # dark theme for every user
    theme: "dark"

unclassified:
  location:
    url: "http://localhost:8090/"

jobs:
  - script: |
      pipelineJob('qa-lab-pipeline') {
        description('QA Lab: runs after every merge to main on GitHub. Image build, tests, deploy to QA, smoke and BDD regression, QA approval, deploy to UAT, smoke (automatic rollback if it fails). Polls GitHub every 2 minutes.')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM {
                scmpoll_spec('H/2 * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/vassilva/qa-lab.git')   // GitHub: changes arrive by pull request (local alternative: file:///repo/qa-lab)
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
