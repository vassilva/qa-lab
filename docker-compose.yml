# Ferramentas partilhadas do QA Lab: Jenkins (CI/CD) e Adminer (base de dados no browser).
# Antes da primeira vez:   docker network create qa-lab-net
# Arranque:                docker compose up -d --build
#
#   Jenkins  http://localhost:8090   (utilizador admin / admin)
#   Adminer  http://localhost:8081   (PostgreSQL · servidor qa-lab-qa-db ou qa-lab-uat-db · qa / qa · qa_lab)
#
# Os ambientes QA e UAT são criados pelo pipeline do Jenkins (ver docker-compose.env.yml).

services:
  jenkins:
    build: ./jenkins
    image: qa-lab-jenkins:local
    container_name: qa-lab-jenkins
    user: root                      # necessário para usar o Docker do teu computador (só em laboratório)
    ports:
      - "8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # o Jenkins comanda o Docker para fazer os deploys
      - ./:/repo/qa-lab:ro                          # o teu repositório Git local (só leitura)
    restart: unless-stopped
    networks:
      - qa-lab-net

  adminer:
    image: adminer:4
    container_name: qa-lab-adminer
    environment:
      ADMINER_DEFAULT_SERVER: qa-lab-qa-db
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - qa-lab-net

volumes:
  jenkins_home:

networks:
  qa-lab-net:
    external: true
