# Jenkins configuration as code (Configuration as Code plugin)
jenkins:
  systemMessage: "QA Lab · lab Jenkins · branches: build + tests · main (after PR merge): Build → QA → approval → UAT (rollback on failed smoke)"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "QA Lab Admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

appearance:
  themeManager:
    disableUserThemes: true     # dark theme for every user
    theme: "dark"

unclassified:
  location:
    url: "http://localhost:8090/"

jobs:
  - script: |
      // Multibranch: one job per Git branch, discovered on GitHub every 2 minutes.
      //   branches (feature/..., fix/...): build + component and API tests (no deploy)
      //   main (after the PR merge):       full pipeline QA → approval → UAT (see Jenkinsfile)
      multibranchPipelineJob('qa-lab') {
        displayName('qa-lab')
        description('QA Lab · one job per branch from GitHub (vassilva/qa-lab). Branches: build + component and API tests. main: build, QA deploy, smoke, BDD regression, approval "Deploy to UAT?", UAT deploy and smoke (rollback if it fails).')
        branchSources {
          git {
            id('qa-lab-github')
            remote('https://github.com/vassilva/qa-lab.git')   // local alternative: file:///repo/qa-lab
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')                                      // scan GitHub for new branches and commits
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            daysToKeep(7)                                       // jobs of merged/deleted branches are removed
          }
        }
      }
