# Um ambiente do QA Lab (QA ou UAT): aplicação + PostgreSQL próprio.
# Não se usa diretamente: o deploy é feito pelo Jenkins ou pelo script scripts/deploy.sh, que corre
#   docker compose -p qa-lab-<env> --env-file envs/<env>.env -f docker-compose.env.yml up -d
# A mesma imagem (APP_IMAGE) é promovida de QA para UAT sem ser reconstruída.

services:
  db:
    image: postgres:16
    container_name: qa-lab-${ENV_NAME}-db
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_lab
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - qa-lab-net      # para o Adminer chegar às duas bases de dados
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-qa-lab:local}
    container_name: qa-lab-${ENV_NAME}-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV_NAME: ${ENV_NAME}
      APP_VERSION: ${APP_VERSION:-local}
      DATABASE_URL: postgresql://qa:qa@db:5432/qa_lab
      QA_LAB_CHALLENGE: ${QA_LAB_CHALLENGE:-0}
    ports:
      - "${APP_PORT}:8000"        # mini bolsa (página + API)
      - "${TERMINAL_PORT}:7681"   # terminal Linux no browser
    volumes:
      - logs:/var/log/qa-lab
    restart: unless-stopped

volumes:
  pgdata:
  logs:

networks:
  qa-lab-net:
    external: true
