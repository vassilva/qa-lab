# Jenkins configuration as code (Configuration as Code plugin)
jenkins:
  systemMessage: "QA Lab · lab Jenkins · pipeline Build → QA → UAT → go/no-go"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "QA Lab Admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

appearance:
  themeManager:
    disableUserThemes: true     # dark theme for every user
    theme: "dark"

unclassified:
  location:
    url: "http://localhost:8090/"

jobs:
  - script: |
      pipelineJob('qa-lab-pipeline') {
        description('QA Lab: image build, tests, deploy to QA, deploy to UAT, smoke tests and go/no-go approval. Polls the repository every 2 minutes.')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM {
                scmpoll_spec('H/2 * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///repo/qa-lab')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
