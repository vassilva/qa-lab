# One QA Lab environment (QA or UAT), with an architecture inspired by Euronext:
#
#   Trading ──(Kafka: trades.executed)──► Settlement ──(SI/CONF files)──► T2S simulator
#      │                                       │
#      └──── PostgreSQL: database "qa_lab" ────┴──── database "settlement" (same server, separate databases)
#
# Not used directly: deployment is done by Jenkins or by scripts/deploy.sh:
#   docker compose -p <qa|uat> --env-file envs/<env>.env -f docker-compose.env.yml up -d
# The same image (APP_IMAGE) runs the three services and is promoted from QA to UAT without being rebuilt.

x-app: &app
  image: ${APP_IMAGE:-qa-lab:local}
  restart: unless-stopped
  volumes:
    - logs:/var/log/qa-lab
    - files:/var/lib/qa-lab/files

x-app-env: &app-env
  ENV_NAME: ${ENV_NAME}
  APP_VERSION: ${APP_VERSION:-local}
  QA_LAB_KAFKA: kafka:9092
  QA_LAB_FILES_DIR: /var/lib/qa-lab/files
  SETTLEMENT_URL: http://settlement:8001
  T2S_URL: http://t2s:8002

services:
  db:
    image: postgres:15     # same version as the psql/pg_dump client in the application container (DEF-011)
    container_name: qa-lab-${ENV_NAME}-db
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_lab
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - qa-lab-net      # so that Adminer can reach the databases
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: qa-lab-${ENV_NAME}-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  kafka-init:             # creates the topics once and exits
    image: apache/kafka:3.9.0
    container_name: qa-lab-${ENV_NAME}-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in trades.executed trades.executed.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"

  app:                    # TRADING service (Order Entry Gateway, Matching Engine, Market Data, web page)
    <<: *app
    container_name: qa-lab-${ENV_NAME}-app
    depends_on:
      db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      SERVICE: trading
      DATABASE_URL: postgresql://qa:qa@db:5432/qa_lab
      QA_LAB_LOG_FILE: qa-lab.log
      QA_LAB_CHALLENGE: ${QA_LAB_CHALLENGE:-0}
    ports:
      - "${APP_PORT}:8000"        # mini exchange (page + API)
      - "${TERMINAL_PORT}:7681"   # Linux terminal in the browser

  settlement:             # SETTLEMENT service (T+2 instructions, end of day, link to T2S)
    <<: *app
    container_name: qa-lab-${ENV_NAME}-settlement
    depends_on:
      db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      SERVICE: settlement
      PORT: 8001
      DATABASE_URL: postgresql://qa:qa@db:5432/settlement
      QA_LAB_LOG_FILE: settlement.log
    ports:
      - "${SETTLEMENT_PORT}:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  t2s:                    # T2S simulator (external system)
    <<: *app
    container_name: qa-lab-${ENV_NAME}-t2s
    environment:
      <<: *app-env
      SERVICE: t2s
      PORT: 8002
      QA_LAB_LOG_FILE: t2s-sim.log
    ports:
      - "${T2S_PORT}:8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  logs:
  files:

networks:
  qa-lab-net:
    external: true
